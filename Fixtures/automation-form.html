<!doctype html>
<html>
<head><meta charset="utf-8"><title>Offline Automation Practice Form</title></head>
<body>
  <main>
    <h1>Practice Form</h1>
    <form>
      <div><label for="given">First Name</label><input id="given" type="text" name="given-value"></div>
      <fieldset><legend>Gender</legend>
        <label><input type="radio" name="sex-choice" value="Male">Male</label>
        <label><input type="radio" name="sex-choice" value="Female">Female</label>
      </fieldset>
      <div><label for="region">State</label>
        <select id="region" name="region-value">
          <option value="India">India</option><option value="Japan">Japan</option>
        </select>
      </div>
    </form>
  </main>
</body>
</html>
