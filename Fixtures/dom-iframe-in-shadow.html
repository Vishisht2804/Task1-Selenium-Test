<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>dom fixture: iframe inside shadow</title></head>
<body><h1>Iframe In Shadow</h1><x-frame-host></x-frame-host>
<script>
customElements.define('x-frame-host', class extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<iframe src="dom-frame-child.html"></iframe>'; }
});
</script></body></html>
